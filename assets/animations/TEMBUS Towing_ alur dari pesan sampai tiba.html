<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f8f7;--card:#fff;--ink:#14211a;--ink2:#415047;--mute:#5f6b63;--line:#c7d1ca;--line2:#718078;--sky:#eef3ef;--road:#c7d1ca;--road2:#718078;--g:#006437;--g2:#007a42;--o:#c2410c;--ob:#ff6a00;--onacc:#fff;--onp:#fff;--forest:#003a20;--bld:#d6e2da;--tree:#b7e4c7;--car:#1d4ed8;--ok:#15803d;--oks:#dcfce7;--focus:#9a3412;--ease:cubic-bezier(.2,0,0,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b120e;--card:#142019;--ink:#f4f7f5;--ink2:#d0dbd3;--mute:#aab5ae;--line:#4b5d52;--line2:#71877a;--sky:#203329;--road:#1b2921;--road2:#4b5d52;--g:#34d399;--g2:#6ee7b7;--o:#fb923c;--onacc:#241000;--onp:#032318;--bld:#2a4435;--tree:#1a7a4c;--car:#60a5fa;--ok:#4ade80;--oks:#123b25;--focus:#fdba74}}
:root[data-theme="dark"]{--bg:#0b120e;--card:#142019;--ink:#f4f7f5;--ink2:#d0dbd3;--mute:#aab5ae;--line:#4b5d52;--line2:#71877a;--sky:#203329;--road:#1b2921;--road2:#4b5d52;--g:#34d399;--g2:#6ee7b7;--o:#fb923c;--onacc:#241000;--onp:#032318;--bld:#2a4435;--tree:#1a7a4c;--car:#60a5fa;--ok:#4ade80;--oks:#123b25;--focus:#fdba74}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.lg{display:block;height:30px;width:auto}.lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:block}}
:root[data-theme="dark"] .lg-light{display:none}:root[data-theme="dark"] .lg-dark{display:block}
h1{font-size:clamp(1.75rem,3vw,2.25rem);line-height:1.2;font-weight:700;margin:12px 0 0}
.sub{color:var(--ink2);font-size:.875rem;margin:4px 0 16px}
svg{width:100%;height:auto;display:block;border-radius:16px;background:var(--sky);border:1px solid var(--line)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.step{display:flex;gap:12px;align-items:flex-start;min-height:72px}
.badge{flex:none;width:32px;height:32px;border-radius:999px;background:var(--o);color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:.875rem}
.card h2{font-size:1.25rem;line-height:1.5;font-weight:700;margin:0}
.card p{margin:0;color:var(--ink2);font-size:.875rem}
.chips{display:flex;gap:8px;margin-top:4px}
.chip{flex:1;height:48px;border:0;background:none;padding:0;position:relative;cursor:pointer}
.chip::before{content:"";position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px;background:var(--line)}
.chip i{position:absolute;left:0;top:20px;height:8px;border-radius:999px;background:var(--g2);width:0}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px}
#hud{transform-box:fill-box;transform-origin:left center}
#hud.pop{animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(.85);opacity:.2}100%{transform:none;opacity:1}}
.b{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:0 16px;min-height:48px;font-size:.875rem;font-weight:600;cursor:pointer}
.b.p{background:var(--o);border-color:var(--o);color:var(--onacc);min-width:96px}
input[type=range]{flex:1;min-width:0;height:48px;accent-color:var(--o)}
:where(button,input):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0ms!important;transition-duration:0ms!important}}
</style></head><body>

<script>
const T=[0,4,7,12,17,22,25],END=25;
const S=[
["Pesan towing","Pelanggan menentukan lokasi jemput dan bengkel tujuan di aplikasi, lalu menekan Pesan Towing."],
["Driver ditemukan","Sistem mencarikan driver towing terdekat. Pelanggan melihat nama, plat, dan estimasi tiba."],
["Towing datang","Truk menuju titik jemput, melewati kendaraan, lalu mundur mendekat ke belakang kendaraan."],
["Kendaraan diangkut","Bak dimiringkan, kendaraan ditarik naik dengan winch, lalu bak diratakan kembali."],
["Perjalanan ke tujuan","Truk membawa kendaraan menuju bengkel yang dipilih pelanggan."],
["Sampai di tujuan","Kendaraan diturunkan di bengkel dan order selesai."]];
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k;
const ez=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const rad=d=>d*Math.PI/180;
const rot=(x,y,a)=>[x*Math.cos(rad(a))-y*Math.sin(rad(a)),x*Math.sin(rad(a))+y*Math.cos(rad(a))];

// pemandangan
let h='';
[[10,42,40],[160,46,52],[225,36,38],[300,58,44],[370,40,36],[440,52,58],[660,44,50],[770,52,60],[860,40,44]].forEach(([x,w,hh])=>{
 h+=`<rect x="${x}" y="${168-hh}" width="${w}" height="${hh}" rx="3" fill="var(--bld)"/>`;
 for(let i=0;i<Math.floor(w/14);i++)h+=`<rect x="${x+6+i*13}" y="${168-hh+8}" width="6" height="7" fill="var(--sky)"/>`;
});
[255,345,415,485,640,730,820].forEach(x=>{h+=`<rect x="${x-2}" y="152" width="4" height="16" fill="#5b6f64"/><circle cx="${x}" cy="146" r="13" fill="var(--tree)"/>`});
$('scn').innerHTML=h;

const world=$('world'),truck=$('truck'),car=$('car'),bed=$('bed');
const camera=t=>t<17?0:t<22?500*ez((t-17)/5):500;

function trk(t){
 let tx=-200,ty=200,a=0;
 if(t>=7&&t<12){const u=(t-7)/5;
  if(u<.6)tx=lerp(-200,235,ez(u/.6));
  else if(u<.7)tx=235;
  else{const k=ez((u-.7)/.3);tx=lerp(235,125,k);ty=lerp(200,184,k)}}
 else if(t>=12&&t<17){tx=125;ty=184;const u=(t-12)/5;
  a=u<.15?-18*ez(u/.15):u<.75?-18:-18*(1-ez((u-.75)/.25))}
 else if(t>=17&&t<22){tx=125+camera(t);ty=184}
 else if(t>=22){tx=625;ty=184;const u=(t-22)/3;
  a=u<.25?-18*ez(u/.25):u<.8?-18:-18*(1-ez((u-.8)/.2))}
 return{tx,ty,a};
}
function ramp(tr){
 const px=tr.tx+76,py=tr.ty-24,c=Math.cos(rad(tr.a)),s=Math.sin(rad(tr.a));
 return{x:px-76*c,y:py-76*s,dx:c,dy:s};
}
const RF=ramp({tx:625,ty:184,a:-18});
function carState(t,tr){
 const R=ramp(tr);
 const on=(s,a)=>({x:R.x+R.dx*s,y:R.y+R.dy*s,a});
 if(t<12)return{x:90,y:184,a:0};
 if(t<17){const u=(t-12)/5;
  if(u<.15)return{x:90,y:184,a:0};
  if(u<.4){const k=ez((u-.15)/.25);return{x:lerp(90,R.x,k),y:lerp(184,R.y,k),a:0}}
  const s=u<.75?lerp(0,38,ez((u-.4)/.35)):38;
  return on(s,tr.a*cl(s/10));}
 if(t<22)return on(38,0);
 const u=(t-22)/3;
 if(u<.25)return on(38,tr.a);
 if(u<.6){const s=lerp(38,0,ez((u-.25)/.35));return on(s,tr.a*cl(s/10))}
 const k=ez((u-.6)/.25);
 return{x:lerp(RF.x,RF.x-45,k),y:184,a:0};
}

const chipsEl=$('chips');
S.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-label',s[0]);b.innerHTML='<i></i>';
 b.onclick=()=>{t=T[i]+.01};chipsEl.appendChild(b)});
const chips=[...chipsEl.children];

let t=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0,idx=-1,carTop=null;
const op=(id,v)=>{$(id).setAttribute('opacity',v)};
let prevTx=-200;
const mk=(n,f)=>[...Array(n)].map(()=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('fill',f);c.setAttribute('opacity',0);world.appendChild(c);return c});
const pe=mk(6,'var(--mute)'),pd=mk(6,'var(--road2)'),pc=[...Array(12)].map((_,i)=>mk(1,i%2?'var(--o)':'var(--g2)')[0]);

function draw(){
 const tr=trk(t),cs=carState(t,tr),cam=camera(t);
 world.setAttribute('transform',`translate(${-cam},0)`);
 const mv=Math.abs(tr.tx-prevTx)>.05,bn=mv?Math.sin(t*38)*.7:0;
 truck.setAttribute('transform',`translate(${tr.tx},${tr.ty+bn})`);
 bed.setAttribute('transform',`rotate(${tr.a} 76 -24)`);
 car.setAttribute('transform',`translate(${cs.x},${cs.y+(t>=17&&t<22?bn:0)}) rotate(${cs.a})`);
 const top=t>=12;
 if(top!==carTop){carTop=top;top?world.insertBefore(truck,car):world.insertBefore(car,truck)}
 const ang=tr.tx*(180/(Math.PI*8));
 document.querySelectorAll('.spin').forEach(e=>e.setAttribute('transform',`rotate(${ang} ${e.dataset.c})`));
 const blink=Math.floor(t*2.5)%2?1:.2;
 document.querySelectorAll('.haz').forEach(e=>e.setAttribute('opacity',t>=17&&t<22?0:blink));
 op('beacon',t>=7?(Math.floor(t*3)%2?1:.2):0);
 // kabel winch
 const cab=$('cable');
 if(t>=12.75&&t<15.75){
  const [wx,wy]=rot(-6,-9,tr.a),[cx,cy]=rot(26,-9,cs.a);
  cab.setAttribute('x1',tr.tx+76+wx);cab.setAttribute('y1',tr.ty-24+wy);
  cab.setAttribute('x2',cs.x+cx);cab.setAttribute('y2',cs.y+cy);cab.setAttribute('opacity',1);
 }else cab.setAttribute('opacity',0);
 // pin & penanda
 const pf=cl(1-(t-12));
 $('cpin').setAttribute('transform',`translate(90,${148+Math.sin(t*5)*2})`);op('cpin',pf);
 const fr=(t*1.3)%1,ring=$('ring');
 ring.setAttribute('rx',10+fr*26);ring.setAttribute('ry',3+fr*8);ring.setAttribute('opacity',t<12?(1-fr)*pf:0);
 op('dpin',cl((t-15)/1.5)*(t<24.2?1:0));
 op('ok',cl((t-24)/.6));
 {const k=cl((t-24)/.6),c1=1.70158,c3=c1+1,sc=t<24?.3:lerp(.3,1,1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2));
  $('ok').setAttribute('transform',`translate(565,70) scale(${sc}) translate(-565,-70)`);
  $('dpin').setAttribute('transform',`translate(0,${Math.sin(t*5)*2})`);}
 // partikel: asap knalpot, debu saat angkut/turun, konfeti saat tiba
 {const dir=Math.sign(tr.tx-prevTx),RR=ramp(tr);
  pe.forEach((c,i)=>{const ph=(t*1.1+i/pe.length)%1;
   c.setAttribute('cx',tr.tx+82-ph*(mv?28*dir:0));c.setAttribute('cy',tr.ty-38-ph*16);
   c.setAttribute('r',1.8+ph*4.5);c.setAttribute('opacity',t>=7?(1-ph)*(mv?.55:.22):0)});
  const ld=(t>=13.5&&t<15.75)||(t>=23&&t<24.3);
  pd.forEach((c,i)=>{const ph=(t*1.6+i/pd.length)%1;
   c.setAttribute('cx',RR.x-ph*16+((i%3)-1)*4);c.setAttribute('cy',RR.y-ph*9);
   c.setAttribute('r',1.5+ph*4.5);c.setAttribute('opacity',ld?(1-ph)*.65:0)});
  pc.forEach((c,i)=>{const a=rad(i*30+15),k=ez(cl((t-24)/1.4)),d=6+k*34;
   c.setAttribute('cx',565+Math.cos(a)*d);c.setAttribute('cy',70+Math.sin(a)*d+k*k*14);
