<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>TEMBUS Paket: pelacakan dari tampilan udara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f8f7;--card:#fff;--ink:#14211a;--ink2:#415047;--mute:#5f6b63;--line:#c7d1ca;--line2:#718078;--g:#006437;--g2:#007a42;--o:#c2410c;--ob:#ff6a00;--onacc:#fff;--onp:#fff;--forest:#003a20;--ok:#15803d;--focus:#9a3412;
--gr:#eef3ef;--rd:#fff;--rde:#c7d1ca;--rdl:#c7d1ca;--bld:#dde6e0;--bld2:#bfccc4;--park:#d8efe0;--tree:#8fcca8;--acs:#fff1e6;--acs2:#f3c9a6;--ins:#dbeafe;--ins2:#a9c4f0;--hz:#e4ece7;--sky:#eef3ef;--dv3:#1d4ed8;--dv4:#7e22ce;--dv5:#0e7490;--dv6:#5f6b63;--ease:cubic-bezier(.2,0,0,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b120e;--card:#142019;--ink:#f4f7f5;--ink2:#d0dbd3;--mute:#aab5ae;--line:#4b5d52;--line2:#71877a;--g:#34d399;--g2:#6ee7b7;--o:#fb923c;--onacc:#241000;--onp:#032318;--ok:#4ade80;--focus:#fdba74;--gr:#142019;--rd:#22362b;--rde:#0b120e;--rdl:#4b5d52;--bld:#2b4538;--bld2:#1b2d23;--park:#123b25;--tree:#1f6b46;--acs:#4a3210;--acs2:#2d1f0a;--ins:#132e52;--ins2:#0b1c36;--hz:#1b2921;--sky:#203329;--dv3:#60a5fa;--dv4:#c084fc;--dv5:#22d3ee;--dv6:#aab5ae}}
:root[data-theme="dark"]{--bg:#0b120e;--card:#142019;--ink:#f4f7f5;--ink2:#d0dbd3;--mute:#aab5ae;--line:#4b5d52;--line2:#71877a;--g:#34d399;--g2:#6ee7b7;--o:#fb923c;--onacc:#241000;--onp:#032318;--ok:#4ade80;--focus:#fdba74;--gr:#142019;--rd:#22362b;--rde:#0b120e;--rdl:#4b5d52;--bld:#2b4538;--bld2:#1b2d23;--park:#123b25;--tree:#1f6b46;--acs:#4a3210;--acs2:#2d1f0a;--ins:#132e52;--ins2:#0b1c36;--hz:#1b2921;--sky:#203329;--dv3:#60a5fa;--dv4:#c084fc;--dv5:#22d3ee;--dv6:#aab5ae}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.lg{display:block;height:30px;width:auto}.lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:block}}
:root[data-theme="dark"] .lg-light{display:none}:root[data-theme="dark"] .lg-dark{display:block}
h1{font-size:clamp(1.75rem,3vw,2.25rem);line-height:1.2;font-weight:700;margin:12px 0 0}
.sub{color:var(--ink2);font-size:.875rem;margin:4px 0 16px}
.mapcard{position:relative;aspect-ratio:1/1.02;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--hz)}
.persp{position:absolute;inset:0;perspective:760px;overflow:hidden}
.map{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotateX(42deg) scale(1.42);transform-origin:50% 60%;transition:transform .3s var(--ease)}
.flat .map{transform:none}
.haze{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,var(--hz) 0,transparent 30%);transition:opacity .3s var(--ease)}
.flat .haze{opacity:0}
.cs{position:absolute;width:46%;height:22%;border-radius:50%;background:#000;opacity:.07;filter:blur(14px);pointer-events:none;animation:drift 38s linear infinite alternate}
.cs.a{top:34%;left:-20%}.cs.b{top:62%;left:10%;animation-duration:52s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(220%)}}
.pill{position:absolute;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8125rem;line-height:1.25;font-weight:600;color:var(--ink)}
.pill svg{flex:none}
.st{top:12px;left:12px}.alt{top:12px;right:12px;color:var(--ink2)}.eta{bottom:12px;left:12px}.brand{bottom:12px;right:12px;padding:7px 12px}
.brand .lg{height:14px}
#sdot{width:8px;height:8px;border-radius:50%;background:var(--o)}
.mk-ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.step{display:flex;gap:12px;align-items:flex-start;min-height:96px}
.badge{flex:none;width:32px;height:32px;border-radius:999px;background:var(--o);color:var(--onacc);display:grid;place-items:center;font-weight:700;font-size:.875rem}
.card h2{font-size:1.25rem;line-height:1.5;font-weight:700;margin:0}
.card p{margin:0;color:var(--ink2);font-size:.875rem}
.chips{display:flex;gap:8px;margin-top:4px}
.chip{flex:1;height:48px;border:0;background:none;padding:0;position:relative;cursor:pointer}
.chip::before{content:"";position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px;background:var(--line)}
.chip i{position:absolute;left:0;top:20px;height:8px;border-radius:999px;background:var(--g2);width:0}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.meta small{display:block;color:var(--mute);font-size:.75rem;font-weight:500}
.meta b{font-size:.8125rem;font-weight:600}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.note{color:var(--mute);font-size:.75rem;margin:8px 0 0}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.b{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:12px;padding:0 16px;min-height:48px;font-size:.875rem;font-weight:600;cursor:pointer}
.b.p{background:var(--o);border-color:var(--o);color:var(--onacc);min-width:96px}
.b[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--onp)}
input[type=range]{flex:1;min-width:120px;height:48px;accent-color:var(--o)}
:where(button,input):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0ms!important;transition-duration:0ms!important}}
.fc{fill:var(--bld2)}.rf{fill:var(--bld)}.fs{fill:var(--acs2)}.rs{fill:var(--acs);stroke:var(--o);stroke-width:1.2}.fh{fill:var(--forest)}.rh{fill:var(--g)}.fd{fill:var(--ins2)}.rd{fill:var(--ins);stroke:var(--dv3);stroke-width:1.2}
</style></head><body>

  P.push(p1);

function at(leg,u){

 return{x:lerp(a[0],b[0],k),y:lerp(a[1],b[1],k),h:Math.atan2(b[1]-a[1],b[0]-a[0])};
}

/* ---- penanda ---- */
const IC={

$('cf').innerHTML=cfh;const cfEl=[...$('cf').children];

/* ---- gerak ---- */
const bikePos=t=>t<11.5?at(LG[0],ez((t-3.5)/5.5)):at(LG[1],ez((t-11.5)/5.5));
const vanPos=t=>at(LG[2],ez((t-19.5)/6.5));
const vehPos=t=>t<19?bikePos(t):vanPos(t);
let lock=false;
function camera(t){
 let x=0,y=0;for(let k=0;k<4;k++){const p=vehPos(Math.max(0,t-k*.25));x+=p.x/4;y+=p.y/4}
 const w=t<3.5?1:t<5.5?1-ez((t-3.5)/2):t>=26.3?ez((t-26.3)/2.2):0;
 let s=t<3.5?.62:t<5.5?lerp(.62,1.3,ez((t-3.5)/2)):t<17?1.3:t<18?lerp(1.3,1.75,ez(t-17)):t<19.5?1.75:t<21?lerp(1.75,1.3,ez((t-19.5)/1.5)):t<26.3?1.3:lerp(1.3,.62,ez((t-26.3)/2.2));

 if(t<10.5){const k=ez((t-9.4)/1.1),b=bikePos(t),r=rr(b);return{x:lerp(323,b.x+r[0],k),y:lerp(432,b.y+r[1],k),z:16*Math.sin(Math.PI*k)+2*k,s:1,v:1}}
 if(t<17){const b=bikePos(t),r=rr(b);return{x:b.x+r[0],y:b.y+r[1],z:2,s:1,v:1}}
 if(t<18.2){const k=ez((t-17)/1.2),b=bikePos(17),r=rr(b);return{x:lerp(b.x+r[0],672,k),y:lerp(b.y+r[1],182,k),z:14*Math.sin(Math.PI*k),s:1,v:1}}
 if(t<19.4)return{x:lerp(672,720,(t-18.2)/1.2),y:182,z:1,s:1,v:1};
 if(t<19.9){const k=ez((t-19.4)/.5);return{x:lerp(720,640,k),y:lerp(182,250,k),z:12*Math.sin(Math.PI*k),s:lerp(1,.4,k),v:1-k}}

 if(t<27.2){const k=ez((t-26)/1.2);return{x:lerp(vp.x+r[0],142,k),y:lerp(vp.y+r[1],276,k),z:16*Math.sin(Math.PI*k),s:1,v:1}}
 return{x:142,y:276,z:0,s:1+.3*Math.max(0,1-(t-27.2)*2.5),v:1};
